<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" stroke="url(#grad)" stroke-width="3" fill="none" />
  <!-- Eye/veil shape -->
  <path d="M16 40 C16 40 28 24 40 24 C52 24 64 40 64 40 C64 40 52 56 40 56 C28 56 16 40 16 40 Z"
        stroke="url(#grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Pupil with slash (hidden identity) -->
  <circle cx="40" cy="40" r="8" fill="url(#grad)" opacity="0.85" />
  <!-- Privacy slash -->
  <line x1="30" y1="52" x2="50" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round" />
</svg>
